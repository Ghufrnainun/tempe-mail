# TempeMail — Cloudflare Worker configuration
# This file is auto-generated by `npm run setup`.
# Do not edit manually — run setup again after changing .env.

name = "tempe-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = false

# Inbound email handler
[email]
action = "process"

# D1 Database — populated by setup
[[d1_databases]]
binding = "DB"
database_name = "tempe-mail-db"
database_id = "REPLACED_BY_SETUP"

# Durable Objects for SSE realtime
[[durable_objects]]
bindings = [{ name = "REALTIME", class_name = "RealtimeRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

# Custom domain route — populated by setup
[[routes]]
pattern = "REPLACED_BY_SETUP"
custom_domain = true

# Environment variables — populated by setup
[vars]
APP_NAME = "TempeMail"
MAIL_DOMAIN = "REPLACED_BY_SETUP"
WEB_HOST = "REPLACED_BY_SETUP"
WORKER_NAME = "tempe-mail"
CF_ZONE_MAP = "REPLACED_BY_SETUP"

# Static assets (web UI)
[assets]
directory = "./src/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Scheduled purge (cron) — clean expired inboxes
[triggers]
crons = ["0 3 * * *"]

# Observability
[observability]
enabled = true
