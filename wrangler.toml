# TempeMail — Cloudflare Worker configuration
# PLACEHOLDER TEMPLATE — this file is committed with placeholder values.
# Run `npm run setup` to render real values (D1 ID, mail domain, web host, zone map).
# Do not commit real values (they leak your account).

name = "tempe-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = false

# Inbound email handler
[email]
action = "process"

# D1 Database — populated by setup
[[d1_databases]]
binding = "DB"
database_name = "tempe-mail-db"
database_id = "__D1_DATABASE_ID__"

# Durable Objects for SSE realtime
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

# R2 bucket for attachment bodies — populated by setup
# [[r2_buckets]]
# binding = "ATTACHMENTS"
# bucket_name = "tempe-mail-attachments"

# Custom domain route — populated by setup (web UI host, NOT the mail domain)
[[routes]]
pattern = "__WEB_HOST__"
custom_domain = true

# Environment variables — populated by setup
[vars]
APP_NAME = "TempeMail"
MAIL_DOMAIN = "__MAIL_DOMAIN__"
WEB_HOST = "__WEB_HOST__"
WORKER_NAME = "tempe-mail"
CF_ZONE_MAP = "__CF_ZONE_MAP__"

# Static assets (web UI)
[assets]
directory = "./src/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Scheduled purge (cron) — clean expired inboxes
[triggers]
crons = ["0 3 * * *"]

# Observability
[observability]
enabled = true
